# Latent-space subset simulation with multi-context rolling MPC scoring

paths:
  natural_dataset_dir: "../../../results/diffusion_natural/following"
  diffusion_checkpoint: "../../../results/diffusion_natural/following/checkpoints/best_noise_mse.pt"
  tail_context_path: "../../../results/highd_tail_contexts/following/tail_contexts.npz"
  evt_model_path: "../../../results/highd_evt/following/longitudinal_evt_model.json"
  pilot_diagnostic_path: "../../../results/subset_simulation/pilot_score_diagnostic.json"
  pilot_scores_path: "../../../results/subset_simulation/pilot_context_scores.csv"

env:
  episode_steps: 200
  commit_steps_max: 10
  lanes_count: 1
  speed_limit: 40.0
  ego_target_speed: 30.0
  initial_gap_min: 0.1

dynamics:
  model: "kinematic_bicycle"
  wheelbase: 5.0
  steering_abs_max: 0.5
  steering_rate_abs_max: 1.0
  speed_min: 0.0
  speed_max: 40.0

ego_response:
  model: "highway_idm"
  enable_lane_change: false

closed_loop_risk:
  collision_bonus: 5.0
  near_collision_weight: 1.0
  hard_brake_weight: 1.0
  hard_brake_threshold: -4.0
  lead_physics_weight: 0.2
  near_collision_gap: 2.0

evt:
  score_space: "evt"
  return_period: 50

physics:
  ax_min: -8.0
  ax_max: 4.0
  jerk_abs_max: 12.0
  speed_min: 0.0

closed_loop_risk_scoring:
  # Shared RSS-free longitudinal score, aligned with highD and adversaray validation.
  ttc_weight: 2.0
  thw_weight: 1.0
  drac_weight: 2.0
  gap_weight: 1.0

  ttc_scale: 1.0
  thw_scale: 1.0
  drac_scale: 5.0
  gap_scale: 1.0

  ttc_eps: 0.2
  thw_eps: 0.2
  gap_eps: 0.5
  pool_beta: 8.0

  jerk_min: -12.0
  jerk_max: 12.0
  accel_min: -8.0
  accel_max: 4.0
  speed_min: 0.0

idm:
  desired_speed: 30.0
  max_accel: 2.0
  comfortable_brake: 2.0
  min_gap: 2.0
  desired_headway: 1.0
  expert_comfortable_brake: 6.0
  expert_min_gap: 3.0
  expert_desired_headway: 1.5
  delta: 4.0
  accel_min: -6.0
  accel_max: 3.0

sampling:
  target_fps: 25
  eval_diffusion_steps: 100

context:
  history_steps: 10

splits:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42

subset_simulation:
  # Use "guarded" only for chain-collapse diagnostics; "standard" keeps the
  # strict subset-simulation probability interpretation.
  estimator_mode: "standard"
  num_samples: 1000
  p0: 0.1
  max_levels: 8
  proposal_std: 0.35
  context_refresh_prob: 0.1
  mh_retries_per_sample: 4
  refresh_attempts_per_sample: 0
  min_next_unique_contexts: 4
  min_next_unique_states: 10
  stop_on_collapse: false
  reliability_min_unique_contexts: 10
  reliability_min_unique_state_fraction: 0.50
  reliability_max_largest_context_share: 0.30
  reliability_max_largest_state_share: 0.10
  reliability_min_acceptance_rate: 0.10
  output_dir: "../../../results/subset_simulation"

pilot_diagnostic:
  samples_per_context: 16
  upper_quantile: 0.95
  lower_quantile: 0.90

training:
  seed: 42
  device: "cuda"
