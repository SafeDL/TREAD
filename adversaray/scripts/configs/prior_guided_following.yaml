# Prior-regularized guided diffusion in closed-loop highway-env car-following

paths:
  natural_dataset_dir: "../../../data/diffusion_natural/following"
  diffusion_checkpoint: "../../../data/diffusion_natural/following/checkpoints/best_noise_mse.pt"
  policy_checkpoint: ""
  output_dir: "../../../data/adversaray/following/prior_guided"
  rss_config: "../../../data/adversaray/following/rss_calibration/recommended_rss_config.yaml"
  highd_events_csv: "../../../data/highd_events/events.csv"
  highd_raw_dir: "../../../highD_dataset/Matlab/data"
  highd_config: "../../../process_highD/scripts/configs/highd_default.yaml"

policy:
  enabled: true
  hidden_dim: 128
  num_layers: 2
  num_heads: 4
  dropout: 0.05
  zero_init_output: true
  guidance_start_ratio: 0.2
  guidance_end_ratio: 0.8
  guidance_clip_norm: 1.0

env:
  episode_steps: 50
  commit_steps_max: 50
  lanes_count: 1
  speed_limit: 40.0
  ego_target_speed: 30.0
  initial_gap_min: 0.1
  skip_invalid_initial_context: true
  invalid_context_reward: 0.0
  reconstruct_highd_events: false

reward:
  collision_bonus: 3.0
  near_collision_weight: 1.0
  ttc_weight: 0.5
  ttc_target: 15.0
  gap_weight: 0.5
  gap_target: 30.0
  rss_weight: 3.0
  rss_scale: 20.0
  rss_risk_clip: 1.0
  hard_brake_weight: 0.0
  hard_brake_threshold: -4.0
  lead_physics_weight: 0.2
  invalid_collision_weight: 2.0
  near_collision_gap: 2.0
  naturalness_gate_enabled: true
  prior_kl_gate_metric: "prior_kl_per_plan"
  prior_kl_gate: 100.0
  physics_gate: 10.0
  jerk_violation_gate: 0.2

rss:
  response_time: 1.0
  ego_max_accel: 1.0
  ego_min_brake: 8.0
  lead_max_brake: 4.0
  temperature: 1.0
  pool_beta: 8.0

physics:
  ax_min: -8.0
  ax_max: 4.0
  jerk_abs_max: 12.0
  speed_min: 0.0

king_gradient:
  enabled: true
  num_steps: 20
  step_size: 0.2
  grad_clip_norm: 1.0

  rss_weight: 3.0
  ttc_weight: 1.0
  drac_weight: 1.0
  gap_weight: 0.5

  ttc_eps: 0.2
  gap_eps: 0.5
  gap_target: 20.0
  pool_beta: 8.0

  lambda_nat: 0.05
  lambda_phys: 1.0

  jerk_min: -12.0
  jerk_max: 12.0
  accel_min: -8.0
  accel_max: 4.0
  speed_min: 0.0

stage1_shared:
  enabled: true
  output_dir: "../../../data/adversaray/following/stage1_shared"

  num_prior_samples_per_context: 2
  num_latents_per_context: 4
  num_surrogate_samples_per_context: 8

  policy:
    hidden_dim: 128
    latent_dim: 8
    template_mode: "brake_template"
    output_residual_scale: 1.0

  optimization:
    epochs: 50
    batch_size: 64
    lr: 1.0e-4
    lambda_nat: 0.05
    lambda_phys: 1.0
    lambda_div: 0.1
    grad_clip_norm: 10.0
    max_train_contexts: 0
    max_val_contexts: 512
    val_batches: 4

  scenario_bank:
    split: "val"
    num_contexts: 256
    batch_size: 16
    output_name: "scenario_bank.npz"

  ego_surrogate:
    type: "idm"
    desired_headway_range: [0.6, 2.5]
    min_gap_range: [1.0, 8.0]
    max_accel_range: [0.8, 3.0]
    comfortable_brake_range: [2.0, 8.0]
    response_time_range: [0.0, 1.2]
    desired_speed_range: [20.0, 35.0]
    delta_range: [4.0, 4.0]

  evt_diagnostics:
    thresholds: [0.90, 0.92, 0.95, 0.97]
    bootstrap_samples: 500
    return_periods: [100, 1000]

sampling:
  train_diffusion_steps: 100
  eval_diffusion_steps: 100
  allow_truncated_train_ddpm: false

training:
  seed: 42
  device: "cuda"
  tail_score_path: "../../../data/adversaray/following/prior_guided/context_tail_scores.npz"
  synthetic_context_path: "../../../data/adversaray/following/prior_guided/synthetic_tail_contexts.npz"
  tail_min_quantile: 0.90
